server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/ld+json application/xml image/svg+xml;

    # Content hashes let the browser cache assets without reusing stale code.
    location ~* "^/assets/.+-[a-z0-9]{8,}\.(js|css|webp)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
